<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find My Booking – Christmas in Focus | CM2</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Pinyon+Script&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="festive">
  <header class="site-header">
    <img src="assets/logo.png" alt="Community Matters 2 (CM2) logo" class="logo" width="72" height="72">
    <p class="eyebrow">CM2 Christmas Collection</p>
    <h1>Christmas <span class="script">in Focus</span></h1>
    <p class="subtitle">Community Through Our Lens</p>
  </header>

  <main>
    <section class="card narrow" aria-labelledby="lookup-heading">
      <h2 id="lookup-heading">Find my booking</h2>
      <p class="muted">Enter the code from your confirmation and the email you booked with.</p>
      <form id="lookup-form">
        <div class="field">
          <label for="code">Booking code <span class="hint">(e.g. CM2-7KQ4XM)</span></label>
          <input id="code" name="code" type="text" required autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="14">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required autocomplete="email">
        </div>
        <div class="message error" id="lookup-error" role="alert"></div>
        <button class="btn block" type="submit" id="lookup-btn">Find my booking</button>
      </form>
    </section>

    <section class="card" id="lookup-result" aria-live="polite" hidden></section>
    <p class="center"><a href="index.html">Back to booking</a></p>
  </main>

  <footer class="site-footer" id="footer"></footer>
  <script type="module" src="js/festive.js"></script>
  <script type="module" src="js/lookup.js"></script>
</body>
</html>
